# Production stack for Dokploy (Compose service).
#
# Required environment variables (Dokploy → Environment):
#   PHX_HOST          the public domain, e.g. remybun.example.com
#   SECRET_KEY_BASE   64+ random characters (mix phx.gen.secret / openssl rand -base64 48)
#   POSTGRES_PASSWORD database password
#
# Route the domain to the `frontend` service on port 80; it serves the app and
# forwards /api and /socket to the backend.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: remybun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: remybun
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remybun -d remybun"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ecto://remybun:${POSTGRES_PASSWORD}@db/remybun
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST:?set PHX_HOST}
      PORT: "4000"
      # Optional: allowed origins (comma-separated); defaults to https://$PHX_HOST
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
